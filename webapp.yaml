# ---------- Deployment: runs and manages the app's Pods ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  # How updates roll out: start 1 new Pod before removing an old one,
  # and never drop below 2 running Pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: my-web-app
        image: irfan29818/terminal-portfolio:77ffe6325be30de61938e1999c028b6690aa8cb8
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: HOSTNAME
          value: "0.0.0.0"
        # Readiness: "can this Pod receive traffic yet?"
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        # Liveness: "is this Pod still alive, or should it be restarted?"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        # How much CPU/memory the Pod reserves (requests) and may use (limits).
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
---
# ---------- Service: one fixed internal address for the Pods ----------
apiVersion: v1
kind: Service
metadata:
  name: my-web-service
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: http
---
# ---------- Ingress: routes outside traffic to the Service ----------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-web-app-ingress
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-web-service
            port:
              number: 80